<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formspree.io; object-src 'none'; base-uri 'self'; form-action https://formspree.io">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>FATMA Research Data</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css?v=5">
</head>
<body data-empreinte="1cfb7100dd46">
<header class="entete">
  <div class="marque">
    <img src="assets/logo.svg" alt="" width="36" height="36">
    <div>
      <div class="nom" translate="no">FATMA Research Data</div>
      <div class="sous-titre" data-t="sousTitre"></div>
    </div>
  </div>
</header>

<main>
  <p class="intro" data-t="intro"></p>
  <nav class="menu" aria-label="Pages">
    <a href="#" data-t="mDonnees"></a> · <a href="#coverage" data-t="mCouverture"></a> · <a href="#guide" data-t="mGuide"></a> · <a href="#reference" data-t="mReference"></a> ·
    <a href="#contact" data-t="mContact"></a>
  </nav>

  <section class="fiche" id="fiche" hidden aria-labelledby="fiche-titre">
    <p><a href="#" class="petit-lien" data-t="retour"></a></p>
    <h2 id="fiche-titre"></h2>
    <div id="fiche-infos" class="infos"></div>
    <div id="fiche-avertissements"></div>
    <h3 data-t="fChiffres"></h3>
    <div class="tableau-cadre"><table id="fiche-chiffres"></table></div>
    <p class="aide" data-t="aideCellule"></p>
    <h3 data-t="fTexte"></h3>
    <div class="tableau-cadre"><table id="fiche-texte"></table></div>
    <h3 data-t="fCouverture"></h3>
    <div id="fiche-couverture"></div>
    <h3 data-t="fDocuments"></h3>
    <ul id="fiche-documents" class="liste-liens"></ul>
    <p><button type="button" class="bouton" id="fiche-signaler" data-t="signalerBanque"></button></p>
  </section>

  <section class="etape" aria-labelledby="t-entites">
    <h2 id="t-entites"><span class="num">1</span><span data-t="etapeEntites"></span></h2>
    <input type="search" id="recherche" class="champ" autocomplete="off" data-t-placeholder="rechercheEntite">
    <div class="puces petites" id="secteurs" aria-label="Sector"></div>
    <div class="puces petites" id="pays" aria-label="Country"></div>
    <div id="liste-entites" class="cartes"></div>
    <p id="aucune-entite" class="vide" hidden data-t="aucuneEntite"></p>
  </section>

  <section class="etape" aria-labelledby="t-perimetre">
    <h2 id="t-perimetre"><span class="num">2</span><span data-t="etapePerimetre"></span></h2>
    <div class="puces" id="perimetres" role="radiogroup"></div>
  </section>

  <section class="etape" aria-labelledby="t-annees">
    <h2 id="t-annees"><span class="num">3</span><span data-t="etapeAnnees"></span></h2>
    <div class="actions-petites">
      <button type="button" class="lien" id="annees-toutes" data-t="toutes"></button>
      <button type="button" class="lien" id="annees-5" data-t="cinqDernieres"></button>
    </div>
    <div class="puces" id="annees"></div>
  </section>

  <section class="etape" aria-labelledby="t-variables">
    <h2 id="t-variables"><span class="num">4</span><span data-t="etapeVariables"></span></h2>
    <div class="puces" id="modes" role="radiogroup"></div>
    <p class="aide" id="aide-mode"></p>
    <div id="familles"></div>
    <h3 data-t="rTitre"></h3>
    <p class="aide" data-t="rAide"></p>
    <div class="boutons constructeur">
      <select id="r-num" class="champ court" aria-label="Numerator"></select>
      <span aria-hidden="true">÷</span>
      <select id="r-den" class="champ court" aria-label="Denominator"></select>
      <button type="button" class="bouton" id="r-ajouter" data-t="rAjouter"></button>
    </div>
    <p id="r-retour" class="confirmation" role="status" hidden></p>
  </section>

  <section class="etape" aria-labelledby="t-apercu">
    <h2 id="t-apercu"><span class="num">5</span><span data-t="etapeApercu"></span></h2>
    <div id="resume" class="tuiles"></div>
    <div id="avertissements"></div>
    <div id="faisabilite" class="faisabilite"></div>
    <div class="legende">
      <span><i class="pastille ok"></i><span data-t="legendeVerifie"></span></span>
      <span><i class="pastille relire"></i><span data-t="legendeRelire"></span></span>
      <span><i class="pastille retraite"></i><span data-t="legendeRetraite"></span></span>
      <span><i class="pastille manque"></i><span data-t="legendeManquant"></span></span>
    </div>
    <p class="aide" data-t="aideCellule"></p>
    <div class="tableau-cadre"><table id="tableau"></table></div>
    <p id="unite-note" class="aide"></p>
  </section>

  <section class="etape" aria-labelledby="t-telecharger">
    <h2 id="t-telecharger"><span class="num">6</span><span data-t="etapeTelecharger"></span></h2>
    <div class="boutons">
      <button type="button" class="bouton principal" id="dl-excel" data-t="telechargerExcel"></button>
      <button type="button" class="bouton" id="dl-csv" data-t="telechargerCsv"></button>
      <button type="button" class="bouton" id="dl-stata" data-t="telechargerStata"></button>
      <button type="button" class="bouton" id="dl-journal" data-t="telechargerJournal"></button>
      <button type="button" class="bouton" id="dl-citation" data-t="telechargerCitation"></button>
    </div>
    <p class="aide" data-t="aideTelechargement"></p>
    <h3 data-t="jeuComplet"></h3>
    <ul id="jeux-complets" class="liste-liens"></ul>
    <h3 data-t="versionsTitre"></h3>
    <p class="aide" data-t="aideVersions"></p>
    <ul id="versions" class="liste-liens"></ul>
    <h3 data-t="mesSelections"></h3>
    <div class="boutons">
      <input type="text" id="nom-selection" class="champ court" maxlength="60" data-t-placeholder="nomSelection">
      <button type="button" class="bouton" id="enregistrer" data-t="enregistrer"></button>
    </div>
    <p id="confirmation" class="confirmation" role="status" hidden></p>
    <ul id="selections" class="liste-liens"></ul>
  </section>

  <section class="etape" aria-labelledby="t-registre" id="registre-section">
    <h2 id="t-registre"><span class="num">7</span><span data-t="etapeRegistre"></span></h2>
    <p class="aide" data-t="aideRegistre"></p>
    <div id="registre-resume" class="tuiles"></div>
    <input type="search" id="registre-recherche" class="champ" autocomplete="off" data-t-placeholder="rechercheRegistre">
    <div id="registre-liste"></div>
  </section>

  <section class="etape" aria-labelledby="t-couverture" id="coverage">
    <h2 id="t-couverture"><span class="num">8</span><span data-t="etapeCouverture"></span></h2>
    <p class="aide" data-t="aideCouverture"></p>
    <div id="couverture-resume" class="tuiles"></div>
    <div class="tableau-cadre"><table id="couverture-table"></table></div>
    <h3 data-t="dTitre"></h3>
    <p class="aide" data-t="dAide"></p>
    <div class="puces petites" id="divulgation-familles" role="radiogroup"></div>
    <div class="tableau-cadre"><table id="divulgation-table"></table></div>
    <p id="divulgation-liste" class="aide"></p>
  </section>

  <section class="etape" aria-labelledby="t-contact" id="contact">
    <h2 id="t-contact"><span class="num">9</span><span data-t="etapeContact"></span></h2>
    <p class="aide" data-t="aideContact"></p>
    <form id="formulaire" novalidate>
      <div class="puces" id="type-message" role="radiogroup"></div>
      <label for="f-entite" data-t="fEntite"></label>
      <input type="text" id="f-entite" class="champ" maxlength="80">
      <label for="f-variable" data-t="fVariable"></label>
      <input type="text" id="f-variable" class="champ" maxlength="120">
      <label for="f-message" data-t="fMessage"></label>
      <textarea id="f-message" class="champ" rows="5" maxlength="1500" required></textarea>
      <label for="f-email" data-t="fEmail"></label>
      <input type="email" id="f-email" class="champ" maxlength="120" required autocomplete="email">
      <input type="text" id="f-gotcha" name="_gotcha" class="piege" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="aide" data-t="fMention"></p>
      <button type="submit" class="bouton principal" id="f-envoyer" data-t="fEnvoyer"></button>
      <p id="f-retour" class="confirmation" role="status" hidden></p>
    </form>
  </section>

  <section class="fiche" id="reference" hidden aria-labelledby="t-reference">
    <p><a href="#" class="petit-lien" data-t="retour"></a></p>
    <h2 id="t-reference" data-t="refTitre"></h2>
    <p class="aide" data-t="refAide"></p>
    <div id="ref-resume" class="tuiles"></div>
    <div class="tableau-cadre"><table id="ref-table"></table></div>
    <p class="actions-petites"><button type="button" class="bouton principal" id="ref-export" data-t="refExport"></button></p>
    <p class="aide" data-t="refEnvoi"></p>
  </section>

  <section class="etape" aria-labelledby="t-guide" id="guide">
    <h2 id="t-guide"><span class="num">10</span><span data-t="etapeGuide"></span></h2>
    <div id="guide-contenu"></div>
  </section>
</main>

<div id="detail" class="fenetre" hidden role="dialog" aria-modal="true" aria-labelledby="detail-titre">
  <div class="fenetre-boite">
    <button type="button" class="fermer" id="detail-fermer" aria-label="Close">×</button>
    <h3 id="detail-titre"></h3>
    <dl id="detail-contenu"></dl>
  </div>
</div>

<footer class="pied">
  <p data-t="piedSources"></p>
  <p data-t="piedQualite"></p>
  <p><span data-t="version"></span> <span id="version" translate="no"></span></p>
  <p>© 2026 FATMA Research Data — <span data-t="droits"></span></p>
</footer>

<script src="assets/son.js?v=1"></script>
<script src="assets/lib/xlsx.full.min.js?v=0.20.3"></script>
<script src="donnees/donnees.js?v=1cfb7100dd46"></script>
<script src="assets/app.js?v=14"></script>
</body>
</html>
